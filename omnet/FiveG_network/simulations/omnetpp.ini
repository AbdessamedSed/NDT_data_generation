[General]
network = src.FiveGNetwork
sim-time-limit = 200s
scheduler-class = "omnetpp::cRealTimeScheduler"

# --- Chemins ---
ned-path = ../src:../../simu5g-1.4.1/src:../../inet-4.5.4/src

# --- Config Réseau ---
*.configurator.typename = "Ipv4NetworkConfigurator"
*.configurator.addDefaultRoutes = true


# ---------------------------------------------------------------------------
# BLINDAGE TOTAL ANTI-DIALOGUE ET ANTI-PORT (L'OPTION FINALE)
# ---------------------------------------------------------------------------
# IDs Réseau (Bloque les pop-ups MasterId)
**.masterId = 1
**.macCellId = 1
**.nrMasterId = 1
**.nrMacCellId = 1

# Paramètres de Mobilité (Bloque les pop-ups Z, StdDev, et Marges)
**.initialZ = 0m
**.mobility.initFromDisplayString = false
**.mobility.updateInterval = 0.01s
**.constraintAreaMinX = 0m
**.constraintAreaMaxX = 1000m
**.constraintAreaMinY = 0m
**.constraintAreaMaxY = 1000m
**.constraintAreaMinZ = 0m
**.constraintAreaMaxZ = 0m
**.speedStdDev = 0mps
**.angleStdDev = 0deg
**.alpha = 0.5
**.margin = 10m

*.server.app[*].localPort = -1
*.ue[*].app[0].localPort = 1000
**.destPort = 1000

**.startTime = 0.1s
**.stopTime = -1s

[Config Statistics]
**.channelModel = "UMA"
**.pathlossModel = "P3GPP38901"
**.transmitter.power = 0.01W
**.cellularNic.phy.receiver.noiseFigure = 5dB


# ---------------------------------------------------------------------------
# VARIATIONS POUR L'APPRENTISSAGE DU GNN (Généralisation)
# ---------------------------------------------------------------------------

# --- 1. Variation du Scheduling (La stratégie de l'antenne) ---
# OMNeT++ va tester successivement ces 3 politiques
**.gnb[*].nic.phy.transmitter.power = 0.01W

# MAXCI , DRR , PF
**.gnb[*].cellularNic.mac.schedulingDisciplineDl = "PF"
**.gnb[*].cellularNic.mac.schedulingDisciplineUl = "PF"
**.gnb[*].cellularNic.numBands = 10

**.rlc.um.queueSize = 200KiB
**.mac.queueSize = 100KiB


# ---------------------------------------------------------------------------
# CONFIGURATION DU SCÉNARIO 20 UEs
# ---------------------------------------------------------------------------
[Config DT-Scenario]
extends = Statistics

*.numUe = 10
*.numGnb = 1


*.dtConnector.numMobilityModules = 11
*.dtConnector.samplingInterval = 0.1s
*.dtConnector.mobilityModulePaths = "ue[0].mobility,ue[1].mobility,ue[2].mobility,ue[3].mobility,ue[4].mobility,ue[5].mobility,ue[6].mobility,ue[7].mobility,ue[8].mobility,ue[9].mobility,gnb[0].mobility"


# --- CONFIGURATION DES PROFILS DE TRAFIC (Varier le Throughput) ---

*.server.numApps = 10
*.ue[*].numApps = 1
*.ue[*].app[0].typename = "UdpSink"
*.server.app[*].typename = "UdpBasicApp"

# UE 0 : Profil VOIP (Petit débit, très régulier, faible latence)
*.server.app[0].destAddresses = "ue[0]"
*.server.app[0].messageLength = intuniform(200B, 1000B) 
*.server.app[0].sendInterval = exponential(0.01s) 

# UE 1 : Vidéo Streaming Adaptive (Débit moyen, paquets variables)
*.server.app[1].destAddresses = "ue[1]"
*.server.app[1].messageLength = intuniform(1200B, 1450B)
*.server.app[1].sendInterval = 0.0005s

# UE 2 : Téléchargement de fichier (Gros débit, rafales/bursts)
*.server.app[2].destAddresses = "ue[2]"
*.server.app[2].messageLength = 5000B
*.server.app[2].sendInterval = 0.0005s

# UE 3 : Capteur IoT (Très faible débit, envois rares)
*.server.app[3].destAddresses = "ue[3]"
*.server.app[3].messageLength = 1450B
*.server.app[3].sendInterval = uniform(0.08s, 0.12s) 

# UE 4 : Flux Critique / Alerte (Trafic saccadé)
*.server.app[4].destAddresses = "ue[4]"
*.server.app[4].messageLength = 1450B
*.server.app[4].sendInterval = uniform(0.001s, 0.05s)
# --- CONFIGURATION DE LA MOBILITÉ (Varier le SINR) ---

# UE 0 : Fixe (Près de l'antenne) -> SINR stable et haut
*.ue[0].mobility.typename = "StationaryMobility"
*.ue[0].mobility.initialX = 510m
*.ue[0].mobility.initialY = 510m

# UE 1 : Piéton lent -> SINR qui varie doucement
*.ue[1].mobility.typename = "LinearMobility"
*.ue[1].mobility.speed = 40mps
*.ue[1].mobility.initialX = 400m
*.ue[1].mobility.initialY = 400m

# UE 2 : Voiture rapide s'éloignant -> SINR qui chute vite
*.ue[2].mobility.typename = "GaussMarkovMobility"
*.ue[2].mobility.speed = 30mps
*.ue[2].mobility.alpha = 0.7
*.ue[2].mobility.initialX = 950m
*.ue[2].mobility.initialY = 950m

# UE 3 : Mouvement aléatoire urbain (GaussMarkov)
*.ue[3].mobility.typename = "GaussMarkovMobility"
*.ue[3].mobility.speed = 40mps
*.ue[3].mobility.alpha = 0.2

# UE 4 : Mouvement circulaire autour du gNB -> SINR oscillant
*.ue[4].mobility.typename = "CircleMobility"
*.ue[4].mobility.cx = 500m
*.ue[4].mobility.cy = 500m
*.ue[4].mobility.r = 100m
*.ue[4].mobility.speed = 5mps
*.server.app[4].startTime = uniform(5s, 10s)    
*.server.app[4].stopTime = uniform(15s, 20s)  




################################



# UE 0 : Profil VOIP (Petit débit, très régulier, faible latence)
*.server.app[5].destAddresses = "ue[5]"
*.server.app[5].messageLength = intuniform(300B, 1000B) 
*.server.app[5].sendInterval = exponential(0.01s) 

# UE 1 : Vidéo Streaming Adaptive (Débit moyen, paquets variables)
*.server.app[6].destAddresses = "ue[6]"
*.server.app[6].messageLength = intuniform(1200B, 1450B)
*.server.app[6].sendInterval = 0.005s

# UE 2 : Téléchargement de fichier (Gros débit, rafales/bursts)
*.server.app[7].destAddresses = "ue[7]"
*.server.app[7].messageLength = 5000B
*.server.app[7].sendInterval = 0.0005s

# UE 3 : Capteur IoT (Très faible débit, envois rares)
*.server.app[8].destAddresses = "ue[8]"
*.server.app[8].messageLength = 5000B
*.server.app[8].sendInterval = uniform(0.08s, 0.1s) 

# UE 4 : Flux Critique / Alerte (Trafic saccadé)
*.server.app[9].destAddresses = "ue[9]"
*.server.app[9].messageLength = 1450B
*.server.app[9].sendInterval = uniform(0.001s, 0.005s)
# --- CONFIGURATION DE LA MOBILITÉ (Varier le SINR) ---

# UE 0 : Fixe (Près de l'antenne) -> SINR stable et haut
*.ue[5].mobility.typename = "StationaryMobility"
