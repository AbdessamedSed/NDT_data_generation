[General]
network = src.FiveGNetwork
sim-time-limit = 200s
scheduler-class = "omnetpp::cRealTimeScheduler"

# --- Chemins ---
ned-path = ../src:../../simu5g-1.4.1/src:../../inet-4.5.4/src

# --- Config Réseau ---
*.configurator.typename = "Ipv4NetworkConfigurator"
*.configurator.addDefaultRoutes = true

# ---------------------------------------------------------------------------
# BLINDAGE TOTAL ANTI-DIALOGUE ET ANTI-PORT (L'OPTION FINALE)
# ---------------------------------------------------------------------------
# IDs Réseau (Bloque les pop-ups MasterId)
**.masterId = 1
**.macCellId = 1
**.nrMasterId = 1
**.nrMacCellId = 1

# Paramètres de Mobilité (Bloque les pop-ups Z, StdDev, et Marges)
**.initialZ = 0m
**.mobility.initFromDisplayString = false
**.mobility.updateInterval = 0.01s
**.constraintAreaMinX = 0m
**.constraintAreaMaxX = 1000m
**.constraintAreaMinY = 0m
**.constraintAreaMaxY = 1000m
**.constraintAreaMinZ = 0m
**.constraintAreaMaxZ = 0m
**.speedStdDev = 0mps
**.angleStdDev = 0deg
**.alpha = 0.5
**.margin = 10m

*.server.app[*].localPort = -1
*.ue[*].app[0].localPort = 1000
**.destPort = 1000

**.startTime = 0.1s
**.stopTime = -1s

[Config Statistics]
**.channelModel = "UMA"
**.pathlossModel = "P3GPP38901"
**.transmitter.power = 0.1W
**.cellularNic.phy.receiver.noiseFigure = 5dB


# ---------------------------------------------------------------------------
# CONFIGURATION DU SCÉNARIO 20 UEs
# ---------------------------------------------------------------------------
[Config DT-Scenario]
extends = Statistics

*.numUe = 20
*.numGnb = 1

# Mise à jour du connecteur pour 20 UEs + 1 gNB
*.dtConnector.numMobilityModules = 21
*.dtConnector.samplingInterval = 0.1s
*.dtConnector.mobilityModulePaths = "ue[0].mobility,ue[1].mobility,ue[2].mobility,ue[3].mobility,ue[4].mobility,ue[5].mobility,ue[6].mobility,ue[7].mobility,ue[8].mobility,ue[9].mobility,ue[10].mobility,ue[11].mobility,ue[12].mobility,ue[13].mobility,ue[14].mobility,ue[15].mobility,ue[16].mobility,ue[17].mobility,ue[18].mobility,ue[19].mobility,gnb[0].mobility"

# --- POSITION gNB ---
*.gnb[0].mobility.initialX = 500m
*.gnb[0].mobility.initialY = 500m

# --- MOBILITÉ DES 20 UEs ---
# 0-6 : Piétons lents (Linear)
*.ue[0..6].mobility.typename = "LinearMobility"
*.ue[0..6].mobility.speed = uniform(1mps, 2mps)
*.ue[0..6].mobility.initialX = uniform(200m, 800m)
*.ue[0..6].mobility.initialY = uniform(200m, 800m)

# 7-13 : Véhicules urbains (GaussMarkov)
*.ue[7..13].mobility.typename = "GaussMarkovMobility"
*.ue[7..13].mobility.speed = 13mps # ~45 km/h
*.ue[7..13].mobility.alpha = 0.5
*.ue[7..13].mobility.speedStdDev = 2mps # Force une variation de +/- 2 m/s
*.ue[7..13].mobility.angleStdDev = 20deg

# 14-19 : Mobilité aléatoire (RandomWaypoint)
#*.ue[14..19].mobility.typename = "RandomWaypointMobility"
#*.ue[14..19].mobility.speed = uniform(5mps, 15mps)

# UE 14-19 : Changements de vitesse fréquents
*.ue[14..19].mobility.typename = "MassMobility"
*.ue[14..19].mobility.changeInterval = uniform(1s, 2s) # Change tous les 1 à 2 sec
*.ue[14..19].mobility.speed = uniform(5mps, 20mps)    # Tire une nouvelle vitesse
*.ue[14..19].mobility.changeAngleBy = normal(0deg, 30deg)
*.ue[14..19].mobility.angleDelta = 0deg 


# ---------------------------------------------------------------------------
# TRAFIC DOWNLINK VARIABLE (Server -> UEs)
# ---------------------------------------------------------------------------
*.server.numApps = 20
*.ue[*].numApps = 1
*.ue[*].app[0].typename = "UdpSink"
*.server.app[*].typename = "UdpBasicApp"

# Mapping des destinations
*.server.app[0].destAddresses = "ue[0]"
*.server.app[1].destAddresses = "ue[1]"
*.server.app[2].destAddresses = "ue[2]"
*.server.app[3].destAddresses = "ue[3]"
*.server.app[4].destAddresses = "ue[4]"
*.server.app[5].destAddresses = "ue[5]"
*.server.app[6].destAddresses = "ue[6]"
*.server.app[7].destAddresses = "ue[7]"
*.server.app[8].destAddresses = "ue[8]"
*.server.app[9].destAddresses = "ue[9]"
*.server.app[10].destAddresses = "ue[10]"
*.server.app[11].destAddresses = "ue[11]"
*.server.app[12].destAddresses = "ue[12]"
*.server.app[13].destAddresses = "ue[13]"
*.server.app[14].destAddresses = "ue[14]"
*.server.app[15].destAddresses = "ue[15]"
*.server.app[16].destAddresses = "ue[16]"
*.server.app[17].destAddresses = "ue[17]"
*.server.app[18].destAddresses = "ue[18]"
*.server.app[19].destAddresses = "ue[19]"

# --- TYPE 1 : Vidéo Haute Qualité (UE 0-6) ---
*.server.app[0..6].messageLength = intuniform(800B, 1450B) 
*.server.app[0..6].sendInterval = exponential(0.01s)

# --- TYPE 2 : VoIP / Gaming (UE 7-13) ---
# Correction ici : Utilisation de intuniform pour simuler une variation autour de 200B
*.server.app[7..13].messageLength = intuniform(150B, 250B)
*.server.app[7..13].sendInterval = uniform(0.02s, 0.05s)

# --- TYPE 3 : Background Download (UE 14-19) ---
*.server.app[14..19].messageLength = intuniform(1000B, 1450B)
*.server.app[14..19].sendInterval = 0.005s