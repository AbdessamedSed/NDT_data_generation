[General]
network = src.FiveGNetwork
sim-time-limit = 100s
scheduler-class = "omnetpp::cRealTimeScheduler"

# --- Chemins ---
ned-path = ../src:../../simu5g-1.4.1/src:../../inet-4.5.4/src

# --- Config Réseau ---
*.configurator.typename = "Ipv4NetworkConfigurator"
*.configurator.addDefaultRoutes = true

# ---------------------------------------------------------------------------
# BLINDAGE ANTI-DIALOGUE ET ANTI-PORT (Pour exécution en batch)
# ---------------------------------------------------------------------------
# IDs Réseau (Bloque les pop-ups MasterId)
**.masterId = 1
**.macCellId = 1
**.nrMasterId = 1
**.nrMacCellId = 1

# Paramètres de Mobilité (Bloque les pop-ups de configuration)
**.initialZ = 0m
**.mobility.initFromDisplayString = false
**.mobility.updateInterval = 0.01s
**.constraintAreaMinX = 0m
**.constraintAreaMaxX = 1000m
**.constraintAreaMinY = 0m
**.constraintAreaMaxY = 1000m
**.constraintAreaMinZ = 0m
**.constraintAreaMaxZ = 100m
**.speedStdDev = 0mps
**.angleStdDev = 0deg
**.alpha = 0.5
**.margin = 10m

# Configuration des ports pour éviter les assignations automatiques conflictuelles
*.server.app[*].localPort = -1
*.ue[*].app[0].localPort = 1000
**.destPort = 1000

# Démarrage et arrêt des applications
**.startTime = 0.1s
**.stopTime = -1s # -1 signifie jusqu'à la fin de la simulation

[Config Statistics]


# Configuration de base pour la physique du canal radio
**.channelModel = "UMA"
#**.pathlossModel = "P3GPP38901"
#**.transmitter.power = 0.01W
#**.cellularNic.phy.receiver.noiseFigure = 5dB

# ---------------------------------------------------------------------------
# VARIATIONS POUR L'APPRENTISSAGE (Généralisation)
# ---------------------------------------------------------------------------

# OMNeT++ va itérer sur ces combinaisons pour générer différents jeux de données
**.gnb[*].cellularNic.phy.transmitter.power = 0.1W
**.gnb[*].cellularNic.mac.schedulingDisciplineDl = "MAXCI"
**.gnb[*].cellularNic.mac.schedulingDisciplineUl = "MAXCI"
**.gnb[*].cellularNic.numBands = 50

# Variation de la taille des files d'attente RLC et MAC
**.rlc.um.queueSize = 2MiB
**.mac.queueSize = 2MiB

# ---------------------------------------------------------------------------
# CONFIGURATION DU SCÉNARIO 5 UEs
# ---------------------------------------------------------------------------
[Config DT-Scenario]
extends = Statistics
extends = Statistics

# --- Configuration des nœuds ---
*.numUe = 10
*.numGnb = 1

# --- Configuration du Jumeau Numérique ---
*.dtConnector.numMobilityModules = 11
*.dtConnector.mobilityModulePaths = "ue[0].mobility,ue[1].mobility,ue[2].mobility,ue[3].mobility,ue[4].mobility,ue[5].mobility,ue[6].mobility,ue[7].mobility,ue[8].mobility,ue[9].mobility,gnb[0].mobility"

# --- Mobilité Gauss-Markov (Trés Aléatoire et Rapide) ---
**.ue[*].mobility.typename = "GaussMarkovMobility"
**.ue[*].mobility.initialZ = 0m

# Paramètres Gauss-Markov pour un mouvement "Brutal"
# alpha = 0.1 -> Très peu de mémoire, les changements de direction/vitesse sont brusques
**.ue[*].mobility.alpha = 0.1 
**.ue[*].mobility.margin = 50m

# Vitesse moyenne cible de 30m/s (108 km/h) avec de fortes variations
**.ue[*].mobility.speed = uniform(0mps, 30mps)
**.ue[*].mobility.speedStdDev = 10mps
**.ue[*].mobility.angleStdDev = 40deg

# Intervalle de mise à jour interne de la mobilité (très fin pour la précision)
**.ue[*].mobility.updateInterval = 0.01s

# --- Trafic Downlink Constant (CBR) ---
# L'objectif est que seule la vitesse influence l'erreur ici
*.server.numApps = 10
*.ue[*].numApps = 1
*.ue[*].app[0].typename = "UdpSink"
*.server.app[*].typename = "UdpBasicApp"
*.server.app[*].destAddresses = "ue[" + string(ancestorIndex(0)) + "]"
*.server.app[*].messageLength = 1450B
*.server.app[*].sendInterval = 0.001s   # 1000 paquets/s (Trafic saturé constant)
**.destPort = 1000

# --- Position du gNB ---
*.gnb[0].mobility.initialX = 500m
*.gnb[0].mobility.initialY = 500m
*.gnb[0].mobility.initialZ = 30m