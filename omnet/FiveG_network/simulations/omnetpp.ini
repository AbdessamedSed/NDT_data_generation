*.ue[7].mobility.initialX = 950m
*.ue[7].mobility.initialY = 950m

# UE 3 : Mouvement aléatoire urbain (GaussMarkov)
*.ue[8].mobility.typename = "GaussMarkovMobility"
*.ue[8].mobility.speed = 40mps
*.ue[8].mobility.alpha = 0.2

# UE 4 : Mouvement circulaire autour du gNB -> SINR oscillant
*.ue[9].mobility.typename = "CircleMobility"
*.ue[9].mobility.cx = 900m
*.ue[9].mobility.cy = 900m
*.ue[9].mobility.r = 200m
