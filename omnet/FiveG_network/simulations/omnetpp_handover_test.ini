[General]
network = src.HandoverTestNetwork
sim-time-limit = 25s
scheduler-class = "omnetpp::cRealTimeScheduler"

ned-path = ../src:../../simu5g-1.4.1/src:../../inet-4.5.4/src

*.configurator.typename = "Ipv4NetworkConfigurator"
*.configurator.addDefaultRoutes = true

# ------------------------------------------------------------
# Base station identities
# ------------------------------------------------------------

*.gnb[0].macCellId = 1
*.gnb[0].nrMacCellId = 1

*.gnb[1].macCellId = 2
*.gnb[1].nrMacCellId = 2

# ------------------------------------------------------------
# gNB locations
# ------------------------------------------------------------

*.gnb[0].mobility.typename = "StationaryMobility"
*.gnb[0].mobility.initialX = 250m
*.gnb[0].mobility.initialY = 500m
*.gnb[0].mobility.initialZ = 30m

*.gnb[1].mobility.typename = "StationaryMobility"
*.gnb[1].mobility.initialX = 750m
*.gnb[1].mobility.initialY = 500m
*.gnb[1].mobility.initialZ = 30m

# ------------------------------------------------------------
# UE initial association
# ------------------------------------------------------------

*.ue.macCellId = 1
*.ue.masterId = 1
*.ue.nrMacCellId = 1
*.ue.nrMasterId = 1

# ------------------------------------------------------------
# Handover test
# ------------------------------------------------------------

# LTE-compatible PHY used internally by NrNicUe
*.ue.cellularNic.phy.enableHandover = true
*.ue.cellularNic.phy.dynamicCellAssociation = true

# NR PHY
*.ue.cellularNic.nrPhy.enableHandover = true
*.ue.cellularNic.nrPhy.dynamicCellAssociation = true

# Allow both gNBs to broadcast information used for handover
*.gnb[*].cellularNic.phy.enableHandover = true
*.gnb[*].cellularNic.nrPhy.enableHandover = true
# ------------------------------------------------------------
# UE mobility
# UE starts near gNB0 and moves toward gNB1
# ------------------------------------------------------------

*.ue.mobility.typename = "LinearMobility"
*.ue.mobility.initialX = 150m
*.ue.mobility.initialY = 500m
*.ue.mobility.initialZ = 1.5m

*.ue.mobility.speed = 30mps
*.ue.mobility.angle = 0deg

*.ue.mobility.initFromDisplayString = false
*.ue.mobility.updateInterval = 0.01s

**.constraintAreaMinX = 0m
**.constraintAreaMaxX = 1000m
**.constraintAreaMinY = 0m
**.constraintAreaMaxY = 1000m
**.constraintAreaMinZ = 0m
**.constraintAreaMaxZ = 100m

# ------------------------------------------------------------
# Radio configuration
# ------------------------------------------------------------

**.channelModel = "UMA"

*.gnb[*].cellularNic.phy.transmitter.power = 0.1W
*.gnb[*].cellularNic.mac.schedulingDisciplineDl = "MAXCI"
*.gnb[*].cellularNic.mac.schedulingDisciplineUl = "MAXCI"
*.gnb[*].cellularNic.numBands = 50

# ------------------------------------------------------------
# Downlink traffic
# ------------------------------------------------------------

*.server.numApps = 1
*.server.app[0].typename = "UdpBasicApp"
*.server.app[0].destAddresses = "ue"
*.server.app[0].destPort = 1000
*.server.app[0].messageLength = 1000B
*.server.app[0].sendInterval = 0.01s
*.server.app[0].startTime = 1s
*.server.app[0].stopTime = -1s

*.ue.numApps = 1
*.ue.app[0].typename = "UdpSink"
*.ue.app[0].localPort = 1000

# ------------------------------------------------------------
# DTConnector
# ------------------------------------------------------------

*.dtConnector.numMobilityModules = 3
*.dtConnector.mobilityModulePaths = "ue.mobility,gnb[0].mobility,gnb[1].mobility"
*.dtConnector.samplingInterval = 0.1s
