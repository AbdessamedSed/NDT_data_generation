include ../../../omnet/FiveG_network/simulations/omnetpp.ini

[Config SC02]
extends = Statistics

# ============================================================================
# SC01 — Baseline / Nominal
# 10 minutes, 1 gNB, 10 UEs, real-time scheduler
# ============================================================================
sim-time-limit = 600s
scheduler-class = "omnetpp::cRealTimeScheduler"

# --- Topology ---------------------------------------------------------------

# One downlink flow per UE

# --- Digital-Twin PT state export ------------------------------------------
# Minimum PT acquisition rate = 10 Hz.
# For f_sync > 10 Hz, the launcher/controller will request a corresponding
# higher PT acquisition rate (20/30/50 Hz) at runtime.
*.dtConnector.samplingInterval = 0.1s

# --- gNB -------------------------------------------------------------------

# --- UE mobility mix --------------------------------------------------------
# SC01 is nominal: low/moderate mobility, no intended handover stress.

# UE0..UE2: stationary

# UE3..UE5: low-speed linear mobility



# UE6..UE9: mild Gauss-Markov mobility

# Common mobility bounds

# --- Traffic ---------------------------------------------------------------
# Nominal low/medium heterogeneous downlink traffic.
# The distributions intentionally differ across UE groups to provide diversity.



# Each application targets one UE.

# Group A — bounded Uniform traffic (UE0..UE3)

# Group B — Exponential arrivals (UE4..UE6)

# Group C — truncated-Normal-like bounded traffic (UE7..UE9)
# OMNeT++ normal() is bounded here to prevent non-physical values.


# SC01 fixed nominal traffic for baseline stability

# --- Native OMNeT++ result files disabled ----------------------------------
# We keep the dedicated JSON/JSONL DT traces instead.
**.vector-recording = false
**.scalar-recording = false

# ============================================================================
# SC02 - MOBILITY-DOMINANT SCENARIO
# ============================================================================
# Objective:
#   - Make mobility synchronization M dominant.
#   - Stable traffic and clean CORE profile.
#   - Heterogeneous low/medium/high mobility.
#   - Short high-speed mobility bursts for selected UEs.
# ============================================================================

*.numUe = 20
*.numGnb = 2


# ============================================================================
# DIGITAL TWIN SAMPLING
# ============================================================================

*.dtConnector.numMobilityModules = 22

*.dtConnector.mobilityModulePaths = "ue[0].mobility,ue[1].mobility,ue[2].mobility,ue[3].mobility,ue[4].mobility,ue[5].mobility,ue[6].mobility,ue[7].mobility,ue[8].mobility,ue[9].mobility,ue[10].mobility,ue[11].mobility,ue[12].mobility,ue[13].mobility,ue[14].mobility,ue[15].mobility,ue[16].mobility,ue[17].mobility,ue[18].mobility,ue[19].mobility,gnb[0].mobility,gnb[1].mobility"


# ============================================================================
# gNB POSITIONS
# ============================================================================

*.gnb[0].mobility.typename = "StationaryMobility"
*.gnb[0].mobility.initialX = 250m
*.gnb[0].mobility.initialY = 500m
*.gnb[0].mobility.initialZ = 30m

*.gnb[1].mobility.typename = "StationaryMobility"
*.gnb[1].mobility.initialX = 750m
*.gnb[1].mobility.initialY = 500m
*.gnb[1].mobility.initialZ = 30m


# ============================================================================
# GROUP A - LOW / MODERATE LINEAR MOBILITY
# UE0 .. UE5
# ============================================================================

*.ue[0..5].mobility.typename = "LinearMobility"
*.ue[0..5].mobility.initialZ = 1.5m

*.ue[0].mobility.initialX = 100m
*.ue[0].mobility.initialY = 150m
*.ue[0].mobility.speed = 5mps
*.ue[0].mobility.angle = 20deg

*.ue[1].mobility.initialX = 150m
*.ue[1].mobility.initialY = 350m
*.ue[1].mobility.speed = 7mps
*.ue[1].mobility.angle = 15deg

*.ue[2].mobility.initialX = 100m
*.ue[2].mobility.initialY = 650m
*.ue[2].mobility.speed = 9mps
*.ue[2].mobility.angle = 350deg

*.ue[3].mobility.initialX = 900m
*.ue[3].mobility.initialY = 200m
*.ue[3].mobility.speed = 6mps
*.ue[3].mobility.angle = 160deg

*.ue[4].mobility.initialX = 850m
*.ue[4].mobility.initialY = 450m
*.ue[4].mobility.speed = 10mps
*.ue[4].mobility.angle = 180deg

*.ue[5].mobility.initialX = 900m
*.ue[5].mobility.initialY = 750m
*.ue[5].mobility.speed = 12mps
*.ue[5].mobility.angle = 200deg


# ============================================================================
# GROUP B - MEDIUM / HIGH LINEAR CROSSING MOBILITY
# UE6 .. UE11
# ============================================================================

*.ue[6..11].mobility.typename = "LinearMobility"
*.ue[6..11].mobility.initialZ = 1.5m

*.ue[6].mobility.initialX = 50m
*.ue[6].mobility.initialY = 250m
*.ue[6].mobility.speed = 14mps
*.ue[6].mobility.angle = 10deg

*.ue[7].mobility.initialX = 50m
*.ue[7].mobility.initialY = 500m
*.ue[7].mobility.speed = 16mps
*.ue[7].mobility.angle = 0deg

*.ue[8].mobility.initialX = 50m
*.ue[8].mobility.initialY = 750m
*.ue[8].mobility.speed = 18mps
*.ue[8].mobility.angle = 350deg

*.ue[9].mobility.initialX = 950m
*.ue[9].mobility.initialY = 250m
*.ue[9].mobility.speed = 15mps
*.ue[9].mobility.angle = 170deg

*.ue[10].mobility.initialX = 950m
*.ue[10].mobility.initialY = 500m
*.ue[10].mobility.speed = 18mps
*.ue[10].mobility.angle = 180deg

*.ue[11].mobility.initialX = 950m
*.ue[11].mobility.initialY = 750m
*.ue[11].mobility.speed = 22mps
*.ue[11].mobility.angle = 190deg


# ============================================================================
# GROUP C - GAUSS-MARKOV MOBILITY
# UE12 .. UE15
# ============================================================================

*.ue[12..15].mobility.typename = "GaussMarkovMobility"

*.ue[12..15].mobility.initialX = uniform(150m,850m)
*.ue[12..15].mobility.initialY = uniform(150m,850m)
*.ue[12..15].mobility.initialZ = 1.5m

*.ue[12..15].mobility.speed = uniform(8mps,20mps)
*.ue[12..15].mobility.speedStdDev = 3mps
*.ue[12..15].mobility.angleStdDev = 15deg
*.ue[12..15].mobility.alpha = 0.75
*.ue[12..15].mobility.margin = 30m


# ============================================================================
# GROUP D - BURSTY HIGH MOBILITY
# UE16 .. UE19
#
# Initial speeds are moderate.
# MobilityBurstController changes their speeds during the simulation.
# ============================================================================

*.ue[16..19].mobility.typename = "BurstLinearMobility"
*.ue[16..19].mobility.initialZ = 1.5m

*.ue[16].mobility.initialX = 100m
*.ue[16].mobility.initialY = 400m
*.ue[16].mobility.speed = 10mps
*.ue[16].mobility.angle = 5deg

*.ue[17].mobility.initialX = 900m
*.ue[17].mobility.initialY = 600m
*.ue[17].mobility.speed = 12mps
*.ue[17].mobility.angle = 175deg

*.ue[18].mobility.initialX = 200m
*.ue[18].mobility.initialY = 100m
*.ue[18].mobility.speed = 11mps
*.ue[18].mobility.angle = 45deg

*.ue[19].mobility.initialX = 800m
*.ue[19].mobility.initialY = 900m
*.ue[19].mobility.speed = 14mps
*.ue[19].mobility.angle = 225deg


# ============================================================================
# MOBILITY BOUNDS
# ============================================================================

**.constraintAreaMinX = 0m
**.constraintAreaMaxX = 1000m
**.constraintAreaMinY = 0m
**.constraintAreaMaxY = 1000m
**.constraintAreaMinZ = 0m
**.constraintAreaMaxZ = 100m


# ============================================================================
# STABLE TRAFFIC
#
# 800 bytes every 25 ms:
#
#     800 * 8 / 0.025 = 256000 bit/s = 256 kbps per UE
#
# Traffic intentionally remains stable so that mobility is the dominant
# source of variation in SC02.
# ============================================================================

*.server.numApps = 20
*.ue[*].numApps = 1

*.server.app[*].typename = "UdpBasicApp"
*.server.app[*].messageLength = 800B
*.server.app[*].sendInterval = 0.025s
*.server.app[*].destPort = 1000
*.server.app[*].startTime = 1s

*.ue[*].app[0].typename = "UdpSink"
*.ue[*].app[0].localPort = 1000

*.server.app[0].destAddresses = "ue[0]"
*.server.app[1].destAddresses = "ue[1]"
*.server.app[2].destAddresses = "ue[2]"
*.server.app[3].destAddresses = "ue[3]"
*.server.app[4].destAddresses = "ue[4]"
*.server.app[5].destAddresses = "ue[5]"
*.server.app[6].destAddresses = "ue[6]"
*.server.app[7].destAddresses = "ue[7]"
*.server.app[8].destAddresses = "ue[8]"
*.server.app[9].destAddresses = "ue[9]"
*.server.app[10].destAddresses = "ue[10]"
*.server.app[11].destAddresses = "ue[11]"
*.server.app[12].destAddresses = "ue[12]"
*.server.app[13].destAddresses = "ue[13]"
*.server.app[14].destAddresses = "ue[14]"
*.server.app[15].destAddresses = "ue[15]"
*.server.app[16].destAddresses = "ue[16]"
*.server.app[17].destAddresses = "ue[17]"
*.server.app[18].destAddresses = "ue[18]"
*.server.app[19].destAddresses = "ue[19]"

# Burst mobility nodes
*.ue[16].mobility.typename = "BurstLinearMobility"
*.ue[17].mobility.typename = "BurstLinearMobility"
*.ue[18].mobility.typename = "BurstLinearMobility"
*.ue[19].mobility.typename = "BurstLinearMobility"
