include omnetpp_SC05.ini

# ============================================================================
# SC06 — DT COMPUTATION-LIMITED CALIBRATION
# ============================================================================
#
# Objective:
#   Isolate computation-induced DT staleness.
#
# Fixed conditions:
#   - 2 gNBs
#   - 20 UEs
#   - moderate mobility
#   - no mobility bursts
#   - stationary heterogeneous downlink traffic
#   - clean PT-DT communication profile (C0)
#
# Only the number of simultaneously active application flows changes.
#
# Calibration profiles:
#   SC06_F8  :  8 active flows
#   SC06_F10 : 10 active flows
#   SC06_F12 : 12 active flows
#   SC06_F14 : 14 active flows
#
# Target:
#   Stable DT/PT progression ratio approximately 0.75–0.85.
# ============================================================================


# ----------------------------------------------------------------------------
# Additional flows used progressively by SC06.
#
# Base SC05 already defines:
#   app[0] : deterministic
#   app[1] : shifted exponential
#   app[2] : uniform
#   app[3] : clipped Gaussian packet size
#   app[4] : shifted Pareto
#
# Additional composition:
#
# F8:
#   DET=1, EXP=2, UNI=2, GAUSS=1, PARETO=2
#
# F10:
#   DET=2, EXP=2, UNI=2, GAUSS=2, PARETO=2
#
# F12:
#   DET=2, EXP=3, UNI=3, GAUSS=2, PARETO=2
#
# F14:
#   DET=2, EXP=3, UNI=3, GAUSS=3, PARETO=3
# ----------------------------------------------------------------------------


# app[5] — shifted exponential
*.server.app[5].destAddresses = "ue[2]"
*.server.app[5].messageLength = 300B
*.server.app[5].sendInterval = \
    (0.010s + exponential(0.090s))

# app[6] — uniform
*.server.app[6].destAddresses = "ue[7]"
*.server.app[6].messageLength = 500B
*.server.app[6].sendInterval = \
    uniform(0.060s, 0.140s)

# app[7] — shifted Pareto
*.server.app[7].destAddresses = "ue[17]"
*.server.app[7].messageLength = 800B
*.server.app[7].sendInterval = \
    pareto_shifted(1.5, 0.040s, 0.010s)


# app[8] — deterministic
*.server.app[8].destAddresses = "ue[4]"
*.server.app[8].messageLength = 200B
*.server.app[8].sendInterval = 0.120s

# app[9] — clipped Gaussian packet size
*.server.app[9].destAddresses = "ue[12]"
*.server.app[9].messageLength = \
    int(min(1200, max(100, normal(700,150)))) * 1B
*.server.app[9].sendInterval = 0.100s


# app[10] — shifted exponential
*.server.app[10].destAddresses = "ue[9]"
*.server.app[10].messageLength = 300B
*.server.app[10].sendInterval = \
    (0.010s + exponential(0.090s))

# app[11] — uniform
*.server.app[11].destAddresses = "ue[15]"
*.server.app[11].messageLength = 500B
*.server.app[11].sendInterval = \
    uniform(0.060s, 0.140s)


# app[12] — clipped Gaussian packet size
*.server.app[12].destAddresses = "ue[1]"
*.server.app[12].messageLength = \
    int(min(1200, max(100, normal(700,150)))) * 1B
*.server.app[12].sendInterval = 0.100s

# app[13] — shifted Pareto
*.server.app[13].destAddresses = "ue[19]"
*.server.app[13].messageLength = 800B
*.server.app[13].sendInterval = \
    pareto_shifted(1.5, 0.040s, 0.010s)


# ============================================================================
# 8-FLOW CALIBRATION
# ============================================================================

[Config SC06_F8]
extends = SC05

sim-time-limit = 120s
*.server.numApps = 8

*.mobilityBurstController.enabled = false


