include ../../../omnet/FiveG_network/simulations/omnetpp.ini

[Config SC03]
extends = Statistics

# ============================================================================
# SC01 — Baseline / Nominal
# 10 minutes, 1 gNB, 10 UEs, real-time scheduler
# ============================================================================
sim-time-limit = 600s
scheduler-class = "omnetpp::cRealTimeScheduler"

# --- Topology ---------------------------------------------------------------

# One downlink flow per UE

# --- Digital-Twin PT state export ------------------------------------------
# Minimum PT acquisition rate = 10 Hz.
# For f_sync > 10 Hz, the launcher/controller will request a corresponding
# higher PT acquisition rate (20/30/50 Hz) at runtime.
*.dtConnector.samplingInterval = 0.1s

# --- gNB -------------------------------------------------------------------

# --- UE mobility mix --------------------------------------------------------
# SC01 is nominal: low/moderate mobility, no intended handover stress.

# UE0..UE2: stationary

# UE3..UE5: low-speed linear mobility



# UE6..UE9: mild Gauss-Markov mobility

# Common mobility bounds

# --- Traffic ---------------------------------------------------------------
# Nominal low/medium heterogeneous downlink traffic.
# The distributions intentionally differ across UE groups to provide diversity.



# Each application targets one UE.

# Group A — bounded Uniform traffic (UE0..UE3)

# Group B — Exponential arrivals (UE4..UE6)

# Group C — truncated-Normal-like bounded traffic (UE7..UE9)
# OMNeT++ normal() is bounded here to prevent non-physical values.


# SC01 fixed nominal traffic for baseline stability

# --- Native OMNeT++ result files disabled ----------------------------------
# We keep the dedicated JSON/JSONL DT traces instead.
**.vector-recording = false
**.scalar-recording = false

# ============================================================================
# SC02 - MOBILITY-DOMINANT SCENARIO
# ============================================================================
# Objective:
#   - Make mobility synchronization M dominant.
#   - Stable traffic and clean CORE profile.
#   - Heterogeneous low/medium/high mobility.
#   - Short high-speed mobility bursts for selected UEs.
# ============================================================================



# ============================================================================
# DIGITAL TWIN SAMPLING
# ============================================================================




# ============================================================================
# gNB POSITIONS
# ============================================================================




# ============================================================================
# GROUP A - LOW / MODERATE LINEAR MOBILITY
# UE0 .. UE5
# ============================================================================









# ============================================================================
# GROUP B - MEDIUM / HIGH LINEAR CROSSING MOBILITY
# UE6 .. UE11
# ============================================================================









# ============================================================================
# GROUP C - GAUSS-MARKOV MOBILITY
# UE12 .. UE15
# ============================================================================





# ============================================================================
# GROUP D - BURSTY HIGH MOBILITY
# UE16 .. UE19
#
# Initial speeds are moderate.
# MobilityBurstController changes their speeds during the simulation.
# ============================================================================







# ============================================================================
# MOBILITY BOUNDS
# ============================================================================

**.constraintAreaMinX = 0m
**.constraintAreaMaxX = 1000m
**.constraintAreaMinY = 0m
**.constraintAreaMaxY = 1000m
**.constraintAreaMinZ = 0m
**.constraintAreaMaxZ = 100m


# ============================================================================
# STABLE TRAFFIC
#
# 800 bytes every 25 ms:
#
#     800 * 8 / 0.025 = 256000 bit/s = 256 kbps per UE
#
# Traffic intentionally remains stable so that mobility is the dominant
# source of variation in SC02.
# ============================================================================





# Burst mobility nodes


# ============================================================
# SC03 - TRAFFIC DOMINATED
# ============================================================
#
# Objective:
#   - isolate traffic dynamics
#   - keep mobility negligible
#   - CORE profile C0 clean
#
# Traffic regimes:
# Traffic regimes:
# 0-100 / 200-300 / 400-500 s: LOW
# 100-200 / 300-400 / 500-600 s: MEDIUM
#
# Traffic families:
#   UE  0..3  : deterministic
#   UE  4..7  : exponential inter-arrival
#   UE  8..11 : uniform inter-arrival
#   UE 12..15 : truncated-normal packet size
#   UE 16..19 : heavy-tailed generalized Pareto inter-arrival
# ============================================================


# ------------------------------------------------------------
# TOPOLOGY
# ------------------------------------------------------------

*.numUe = 20
*.numGnb = 1
*.numBgCells = 0

*.mobilityBurstController.enabled = false


# ------------------------------------------------------------
# gNB
# ------------------------------------------------------------

*.gnb[0].mobility.typename = "StationaryMobility"
*.gnb[0].mobility.initialX = 500m
*.gnb[0].mobility.initialY = 500m
*.gnb[0].mobility.initialZ = 30m


# ------------------------------------------------------------
# UE MOBILITY
#
# Mobility is intentionally suppressed in SC03 so that traffic
# dynamics dominate the PT/DT divergence.
# ------------------------------------------------------------

*.ue[*].mobility.typename = "StationaryMobility"

*.ue[*].mobility.initialX = uniform(200m, 800m)
*.ue[*].mobility.initialY = uniform(200m, 800m)
*.ue[*].mobility.initialZ = 1.5m


# ------------------------------------------------------------
# DT CONNECTOR
# 20 UEs + 1 gNB = 21 mobility modules
# ------------------------------------------------------------

*.dtConnector.numMobilityModules = 21
*.dtConnector.mobilityModulePaths = "ue[0].mobility,ue[1].mobility,ue[2].mobility,ue[3].mobility,ue[4].mobility,ue[5].mobility,ue[6].mobility,ue[7].mobility,ue[8].mobility,ue[9].mobility,ue[10].mobility,ue[11].mobility,ue[12].mobility,ue[13].mobility,ue[14].mobility,ue[15].mobility,ue[16].mobility,ue[17].mobility,ue[18].mobility,ue[19].mobility,gnb[0].mobility"


# ============================================================
# APPLICATIONS
# ============================================================

*.server.numApps = 8
*.ue[*].numApps = 1

*.server.app[*].typename = "UdpBasicApp"
*.server.app[*].destAddresses = "ue[" + string(ancestorIndex(0)) + "]"
*.server.app[*].destPort = 1000
*.server.app[*].startTime = 1s
*.server.app[*].stopTime = -1s

*.ue[*].app[0].typename = "UdpSink"
*.ue[*].app[0].localPort = 1000


# ============================================================
# GROUP A - DETERMINISTIC
# UE 0..3
#
# LOW    : 40 ms
# MEDIUM : 20 ms
# HIGH   : 8 ms
# ============================================================

*.server.app[0].messageLength = 200B

*.server.app[0].sendInterval = \
    simTime() < 100s ? 0.160s : \
    simTime() < 200s ? 0.080s : \
    simTime() < 300s ? 0.160s : \
    simTime() < 400s ? 0.080s : \
    simTime() < 500s ? 0.160s : \
                       0.080s


# ============================================================
# GROUP B - EXPONENTIAL
# UE 4..7
#
# Shifted-exponential renewal packet arrivals.
#
# LOW    : mean 25 ms
# MEDIUM : mean 12 ms
# HIGH   : mean 5 ms
# ============================================================

*.server.app[1..2].messageLength = 300B

*.server.app[1..2].sendInterval = \
    simTime() < 100s ? (0.008s + exponential(0.092s)) : \
    simTime() < 200s ? (0.004s + exponential(0.044s)) : \
    simTime() < 300s ? (0.008s + exponential(0.092s)) : \
    simTime() < 400s ? (0.004s + exponential(0.044s)) : \
    simTime() < 500s ? (0.008s + exponential(0.092s)) : \
                       (0.004s + exponential(0.044s))


# ============================================================
# GROUP C - UNIFORM IAT
# UE 8..11
#
# LOW    : U(15,35) ms
# MEDIUM : U(6,18) ms
# HIGH   : U(2.5,7.5) ms
# ============================================================

*.server.app[3..4].messageLength = 500B

*.server.app[3..4].sendInterval = \
    simTime() < 100s ? uniform(0.060s, 0.140s) : \
    simTime() < 200s ? uniform(0.024s, 0.072s) : \
    simTime() < 300s ? uniform(0.060s, 0.140s) : \
    simTime() < 400s ? uniform(0.024s, 0.072s) : \
    simTime() < 500s ? uniform(0.060s, 0.140s) : \
                       uniform(0.024s, 0.072s)


# ============================================================
# GROUP D - VARIABLE PACKET SIZE
# UE 5
#
# Packet size follows a bounded Normal distribution.
# IAT still follows LOW / MEDIUM / HIGH load regimes.
# ============================================================

*.server.app[5].messageLength = \
    min(1200, max(100, int(normal(700, 150)))) * 1B

*.server.app[5].sendInterval = \
    simTime() < 100s ? 0.100s : \
    simTime() < 200s ? 0.048s : \
    simTime() < 300s ? 0.100s : \
    simTime() < 400s ? 0.048s : \
    simTime() < 500s ? 0.100s : \
                       0.048s


# ============================================================
# GROUP E - HEAVY-TAILED / GENERALIZED PARETO
# UE 6..7
#
# Heavy-tail traffic with decreasing time scale as load rises.
# ============================================================

*.server.app[6..7].messageLength = 800B

*.server.app[6..7].sendInterval = \
    simTime() < 100s ? pareto_shifted(1.5, 0.040s, 0.008s) : \
    simTime() < 200s ? pareto_shifted(1.5, 0.020s, 0.004s) : \
    simTime() < 300s ? pareto_shifted(1.5, 0.040s, 0.008s) : \
    simTime() < 400s ? pareto_shifted(1.5, 0.020s, 0.004s) : \
    simTime() < 500s ? pareto_shifted(1.5, 0.040s, 0.008s) : \
                       pareto_shifted(1.5, 0.020s, 0.004s)

